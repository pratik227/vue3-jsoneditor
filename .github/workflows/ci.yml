name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Build docs
        working-directory: docs
        run: |
          npm install
          npm run build
      - name: Check LLM files were generated
        run: test -s docs/.vitepress/dist/llms.txt && test -s docs/.vitepress/dist/llms-full.txt
